<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legal | ToolCare</title>
  <meta name="description" content="Legal information for ToolCare.">
  <style>
:root {
  --blue: #0D3B78;
  --green: #2FB85A;
  --slate: #475569;
  --bg: #f8fafc;
  --border: #e2e8f0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: #0f172a;
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.6;
}
.site-header {
  background: var(--blue);
  color: white;
  padding: 24px;
}
.site-header__inner, main, .site-footer {
  width: min(1040px, calc(100% - 32px));
  margin: 0 auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 24px;
  font-weight: 700;
}
.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: white;
  color: var(--blue);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
}
.nav {
  margin-top: 14px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.nav a {
  color: white;
  text-decoration: none;
  border-bottom: 2px solid transparent;
}
.nav a:hover { border-bottom-color: var(--green); }
main {
  padding: 32px 0;
}
.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: clamp(20px, 4vw, 40px);
  box-shadow: 0 16px 40px rgba(15, 23, 42, 0.06);
}
h1, h2, h3 {
  color: #0f172a;
  line-height: 1.2;
}
h1 { font-size: clamp(30px, 5vw, 44px); margin-top: 0; }
h2 { margin-top: 32px; }
a { color: var(--blue); }
.button {
  display: inline-block;
  background: var(--blue);
  color: white;
  padding: 12px 18px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 700;
}
.notice {
  border-left: 4px solid var(--green);
  background: #f0fdf4;
  padding: 16px;
  border-radius: 12px;
}
.site-footer {
  color: var(--slate);
  padding: 24px 0 40px;
  font-size: 14px;
}
.termly-policy [data-custom-class='body'] {
  max-width: 100%;
}
.termly-policy table {
  max-width: 100%;
  overflow-x: auto;
  display: block;
}
.termly-policy h1, .termly-policy h2, .termly-policy h3 {
  color: #0f172a !important;
}
</style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="brand"><span class="brand-mark">T</span><span>ToolCare</span></div>
      <nav class="nav" aria-label="Legal pages">
        <a href="./privacy.html">Privacy Policy</a>
        <a href="./account-deletion.html">Account Deletion</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="card">

      <h1>ToolCare Legal</h1>
      <p>Legal and privacy information for ToolCare by Thomassen Solutions.</p>
      <p><a class="button" href="./privacy.html">Privacy Policy</a></p>
      <p><a class="button" href="./account-deletion.html">Account Deletion</a></p>

    </section>
  </main>
  <footer class="site-footer">
    © 2026 Thomassen Solutions. ToolCare is a tool maintenance application.
  </footer>
</body>
</html>
